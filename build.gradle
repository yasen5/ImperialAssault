plugins {
    id 'java'
}

import org.gradle.api.tasks.JavaExec

group = 'com.yasen.quarter4project'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.debug = true
}

jar {
    archiveBaseName = project.name
}

tasks.register('runServer', JavaExec) {
    group = 'application'
    description = 'Runs the multiplayer server.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'runners.ServerRunner'
    def projectArgs = project.findProperty('args')?.toString()?.trim()
    if (projectArgs) {
        args projectArgs.split('\\s+')
    }
}

tasks.register('runClient', JavaExec) {
    group = 'application'
    description = 'Runs the multiplayer client.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'runners.ClientRunner'
    def projectArgs = project.findProperty('args')?.toString()?.trim()
    if (projectArgs) {
        args projectArgs.split('\\s+')
    }
}

tasks.register('smokeTutorialNetwork', JavaExec) {
    group = 'verification'
    description = 'Runs a headless socket-level smoke test through lobby, hero selection, and first Rebel action prompt.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'runners.HeadlessNetworkSmokeTest'
    def projectArgs = project.findProperty('args')?.toString()?.trim()
    if (projectArgs) {
        args projectArgs.split('\\s+')
    }
}

tasks.register('deploymentCardVisualTest', JavaExec) {
    group = 'verification'
    description = 'Opens the mission 2 GUI in a JFrame and captures deployment-card alignment screenshots for all Rebel and Imperial figures.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'runners.DeploymentCardVisualTest'
    def projectArgs = project.findProperty('args')?.toString()?.trim()
    if (projectArgs) {
        args projectArgs.split('\\s+')
    }
}
